metadata:
  name: pth-ultralytics-yolov8
  namespace: cvat
  annotations:
    name: YOLOv8
    type: detector
    spec: |
      [
        {"id": "COUNT", "name": "COUNT"},
        {"id": "small_colony", "name": "small_colony"},
        {"id": "reflection", "name": "reflection"},
        {"id": "plate", "name": "plate"}
      ]

spec:
  description: Object detection with YOLOv8
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s

  build:
    image: cvat.pth.ultralytics.yolov8
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: apt-get update && apt-get -y install curl git python3 python3-pip ffmpeg libsm6 libxext6
        - kind: RUN
          value: pip3 install ultralytics
        - kind: RUN
          value: ln -s /usr/bin/pip3 /usr/local/bin/pip && ln -s /usr/bin/python3 /usr/bin/python
    codeEntryType: image
    codeEntryAttributes:
      workDir: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      mountMode: volume
      network: cvat_cvat
      restartPolicy:
        maximumRetryCount: 3
        name: always
